      - name: Collect official channel updates
        id: collect
        continue-on-error: true
        run: python cloud_collect.py

      - name: Validate the published data
        run: >-
          python -c "import json; from pathlib import Path;
          d=json.loads(Path('web/data/news.json').read_text(encoding='utf-8'));
          assert d['schema_version']==1 and isinstance(d['items'],list) and isinstance(d['sources'],list);
          assert d.get('generated_at') and isinstance(d['status'],dict)"

      - name: Keep collected history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .gitignore README.md cloud_collect.py collectors.py server.py sources.json web/app.js web/index.html web/styles.css web/data/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official channel data"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
          retention-days: 1

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Collection failed. The last retained data and any available source status were published. Check the collection step above.'
          exit 1
